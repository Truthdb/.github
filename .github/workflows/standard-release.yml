name: Standard Release

on:
  workflow_call:
    inputs:
      project_name:
        type: string
        required: true
      runs_on:
        type: string
        default: ubuntu-latest
      install_packages:
        type: string
        default: ""
      assets_list:
        type: string
        default: ""
      extra_body:
        type: string
        default: ""
      build_script:
        type: string
        required: true
      files:
        type: string
        default: dist/*

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install system packages
        if: ${{ inputs.install_packages != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y ${INSTALL_PACKAGES}
        env:
          INSTALL_PACKAGES: ${{ inputs.install_packages }}

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          prev_tag=$(git describe --abbrev=0 --tags "$(git rev-list --tags --skip=1 --max-count=1)" 2>/dev/null || true)
          if [[ -z "$prev_tag" ]]; then
            changelog="Initial release"
          else
            changelog=$(git log "${prev_tag}..HEAD" --pretty=format:"- %s" --no-merges)
          fi

          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changelog" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          ${BUILD_SCRIPT}
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail

          assets_list='${{ inputs.assets_list }}'
          assets_list="${assets_list//\$VERSION/$VERSION}"
          assets_list="${assets_list//\$TAG/$TAG}"

          extra_body='${{ inputs.extra_body }}'
          extra_body="${extra_body//\$VERSION/$VERSION}"
          extra_body="${extra_body//\$TAG/$TAG}"

          assets_block=""
          if [[ -n "${assets_list//[[:space:]]/}" ]]; then
            assets_block="\n### Assets\n\n${assets_list}\n"
          fi

          cat > release_notes.md <<EOF
          ## ${PROJECT_NAME} ${VERSION}

          ### Changes
          ${{ steps.changelog.outputs.CHANGELOG }}

          ${extra_body}${assets_block}
          EOF
        env:
          PROJECT_NAME: ${{ inputs.project_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: ${{ inputs.files }}
          fail_on_unmatched_files: true
