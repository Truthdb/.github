name: Docker Image Release

on:
  workflow_call:
    inputs:
      project_name:
        type: string
        required: true
      image_repo:
        type: string
        required: true
      dockerfile:
        type: string
        default: docker/Dockerfile
      context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      extra_body:
        type: string
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          prev_tag=$(git describe --abbrev=0 --tags "$(git rev-list --tags --skip=1 --max-count=1)" 2>/dev/null || true)
          if [[ -z "$prev_tag" ]]; then
            changelog="Initial release"
          else
            changelog=$(git log "${prev_tag}..HEAD" --pretty=format:"- %s" --no-merges)
          fi

          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changelog" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ inputs.image_repo }}:latest
            ${{ inputs.image_repo }}:${{ github.sha }}
            ${{ inputs.image_repo }}:${{ env.TAG }}
            ${{ inputs.image_repo }}:${{ env.VERSION }}

      - name: Package release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "image=${IMAGE_REPO}";
            echo "tag=${TAG}";
            echo "version=${VERSION}";
            echo "digest=${DIGEST}";
            echo "pull_tag=docker pull ${IMAGE_REPO}:${TAG}";
            echo "pull_digest=docker pull ${IMAGE_REPO}@${DIGEST}";
          } > dist/image.txt
        env:
          IMAGE_REPO: ${{ inputs.image_repo }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          extra_body='${{ inputs.extra_body }}'
          extra_body="${extra_body//\$VERSION/$VERSION}"
          extra_body="${extra_body//\$TAG/$TAG}"

          cat > release_notes.md <<EOF
          ## ${PROJECT_NAME} ${VERSION}

          ### Changes
          ${{ steps.changelog.outputs.CHANGELOG }}

          ${extra_body}

          ### Container

          - Image: ${IMAGE_REPO}
          - Tag: ${TAG}
          - Digest: ${DIGEST}
          EOF
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          IMAGE_REPO: ${{ inputs.image_repo }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/image.txt
          fail_on_unmatched_files: true
